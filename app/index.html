<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battle Animator</title>
    <link rel="icon" href="data:," />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="workspace" aria-label="Battle animation workspace">
        <div class="map-stage" id="map-stage">
          <div id="battle-map" role="application" aria-label="Generated battle map animation"></div>

          <ul id="legend" class="legend" aria-label="Sides"></ul>

          <div class="map-caption">
            <span id="battle-name">Battle Animator</span>
            <span id="battle-date">Loading examples/battle-of-waterloo.json</span>
          </div>

          <div class="drop-hint">Drop battle JSON here</div>
        </div>

        <section id="event-card-stack" class="event-card-stack" aria-live="polite" aria-label="Recent battle events"></section>

        <aside class="inspector" aria-label="Battle details">
          <header>
            <p class="eyebrow">battle-animation-schema MVP</p>
            <h1>Battle Animator</h1>
            <p id="battle-summary">Generating a map animation from structured battle JSON.</p>
          </header>

          <div class="loader" aria-label="Load battle JSON">
            <label class="file-button">
              Load JSON file
              <input id="file-input" type="file" accept="application/json,.json" hidden />
            </label>
            <button id="paste-button" type="button" class="ghost">Paste JSON…</button>
          </div>

          <div id="error-banner" class="error-banner" role="alert" hidden></div>
          <div id="validation-warnings" class="warning-banner" role="status" hidden></div>

          <div class="controls" aria-label="Playback controls">
            <div class="transport-row">
              <button id="play-button" type="button" aria-pressed="false">Play</button>
              <button id="reset-button" type="button" class="ghost">Reset</button>
              <button id="prev-button" type="button" class="ghost" aria-label="Previous event">Prev</button>
              <button id="next-button" type="button" class="ghost" aria-label="Next event">Next</button>
            </div>
            <div class="playback-options">
              <div id="speed-controls" class="speed-controls" aria-label="Playback speed">
                <button type="button" class="ghost" data-speed="0.5" aria-pressed="false">0.5×</button>
                <button type="button" class="ghost" data-speed="1" aria-pressed="true">1×</button>
                <button type="button" class="ghost" data-speed="2" aria-pressed="false">2×</button>
                <button type="button" class="ghost" data-speed="4" aria-pressed="false">4×</button>
              </div>
              <button id="follow-button" type="button" class="ghost" aria-pressed="true">Follow: on</button>
              <button id="trails-button" type="button" class="ghost" aria-pressed="false">Trails: off</button>
              <button id="focus-event-button" type="button" class="ghost" disabled>Focus event</button>
              <button id="modern-borders-button" type="button" class="ghost" aria-pressed="false">Modern borders: off</button>
              <button id="fronts-button" type="button" class="ghost" aria-pressed="false" disabled>Fronts: off</button>
            </div>
            <label class="scrubber">
              <span class="scrubber-row">
                <span id="historical-time">Animation time 00:00</span>
                <span id="event-progress">0 / 0</span>
              </span>
              <input id="event-scrubber" type="range" min="0" max="0" value="0" step="any" />
            </label>
            <p id="compression-notice" class="compression-notice" hidden></p>
          </div>

          <ol id="timeline" class="timeline" aria-label="Timeline events"></ol>
        </aside>
      </section>
    </main>

    <dialog id="paste-dialog" class="paste-dialog">
      <form method="dialog">
        <h2>Paste battle JSON</h2>
        <textarea id="paste-text" rows="14" placeholder="Paste a battle-animation-schema v0.1.0 document…"></textarea>
        <menu>
          <button id="paste-cancel" type="button" class="ghost">Cancel</button>
          <button id="paste-load" type="button">Load</button>
        </menu>
      </form>
    </dialog>

    <script type="module">
      import {
        loadBattle,
        resetBattleUI,
        setBattleDocument,
        setBattleDocumentFromText,
        showDiagnosticList,
      } from "./animate.js";

      const $ = (id) => document.getElementById(id);
      let controller;

      function showErrors(errors) {
        showDiagnosticList(document, "error-banner", "JSON validation failed", errors);
      }

      function showWarnings(warnings) {
        showDiagnosticList(document, "validation-warnings", "JSON validation warnings", warnings);
      }

      function destroyController() {
        controller?.destroy();
        controller = undefined;
      }

      function setBattle(battle) {
        controller = setBattleDocument(battle, {
          documentRef: document,
          previousController: controller,
        });
      }

      function loadFromText(text) {
        controller = setBattleDocumentFromText(text, {
          documentRef: document,
          previousController: controller,
        });
      }

      async function loadFromFile(file) {
        loadFromText(await file.text());
      }

      $("file-input").addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) loadFromFile(file);
      });

      $("paste-button").addEventListener("click", () => $("paste-dialog").showModal());
      $("paste-cancel").addEventListener("click", () => $("paste-dialog").close());
      $("paste-load").addEventListener("click", () => {
        $("paste-dialog").close();
        loadFromText($("paste-text").value);
      });

      const stage = $("map-stage");
      ["dragenter", "dragover"].forEach((type) =>
        stage.addEventListener(type, (event) => {
          event.preventDefault();
          stage.classList.add("is-dragover");
        })
      );
      ["dragleave", "drop"].forEach((type) =>
        stage.addEventListener(type, (event) => {
          event.preventDefault();
          if (type === "drop" || event.target === stage) stage.classList.remove("is-dragover");
        })
      );
      stage.addEventListener("drop", (event) => {
        const file = event.dataTransfer?.files[0];
        if (file) loadFromFile(file);
      });

      try {
        const battle = await loadBattle("../examples/battle-of-waterloo.json");
        setBattle(battle);
      } catch (error) {
        destroyController();
        resetBattleUI(document);
        showWarnings([]);
        showErrors([`Failed to load default example: ${error.message}`]);
      }
    </script>
  </body>
</html>
